    <!-- Schema.org: FAQPage — Q wording mirrors the visible FAQ on Landing.jsx so Google validates the rich result. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How is NYTHOS different from Nansen or Arkham?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nansen and Arkham are research tools — useful for historical deep-dives but slow for real-time trading. NYTHOS is built signal-first: every whale movement is scored, surfaced instantly, and verified on-chain after the fact so you can audit accuracy before you trust it. And the beta is free."
          }
        },
        {
          "@type": "Question",
          "name": "How is NYTHOS different from Whale Alert?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Whale Alert broadcasts raw transaction sizes on social media with no scoring, no history, and no accuracy record. NYTHOS scores every signal HIGH / MED / LOW, checks the outcome after 24h, and gives you a full 30-day queryable history — so you know which signals actually moved markets."
          }
        },
        {
          "@type": "Question",
          "name": "What blockchains are supported?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ETH, BTC, and Base today. ETH and Base include DEX activity, bridge flows, and smart contract interactions. BTC covers large-wallet accumulation and dormant-wallet reactivation. SOL support is in development."
          }
        },
        {
          "@type": "Question",
          "name": "Is it really free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Full beta access — live signals, wallet scoring, 30-day history, REST API, and Telegram alerts — requires only a wallet connection. No subscription, no credit card. Token-gated tiers activate after the Base contract audit."
          }
        },
        {
          "@type": "Question",
          "name": "How accurate are the signals?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every signal is verified automatically after it fires. The public proof feed shows verified hits and misses with full context. Accuracy is tracked over 24h windows and displayed live at nythos.io/proof."
          }
        },
        {
          "@type": "Question",
          "name": "What is the $NYT token?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "$NYT is the NYTHOS access token planned for Base after a professional smart contract audit. It gates Pro (100 $NYT) and Partner (5,000 $NYT) tiers. Founder round price is $0.005. No token is needed during open beta."
          }
        }
      ]
    }
