    <!-- Schema.org: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is NYTHOS?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "NYTHOS is a real-time on-chain intelligence platform that monitors Ethereum, Bitcoin, and Base for large-wallet activity. It scores every signal HIGH, MED, or LOW by confidence and delivers a live feed traders can act on. No token or subscription is required during open beta."
          }
        },
        {
          "@type": "Question",
          "name": "How is NYTHOS different from Nansen or Arkham?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nansen and Arkham focus on entity labeling and historical dashboards — useful for research but slow for real-time trading decisions. NYTHOS is built signal-first: every whale movement is scored and surfaced instantly, with 30-day outcome verification so you can audit accuracy before trusting it. The beta is free, no $149/month subscription required."
          }
        },
        {
          "@type": "Question",
          "name": "How is NYTHOS different from Whale Alert?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Whale Alert broadcasts raw transaction sizes on social media with no scoring, no history, and no accuracy tracking. NYTHOS scores every signal by confidence level, verifies outcomes on-chain, and lets you query the full 30-day history via REST API or the dashboard."
          }
        },
        {
          "@type": "Question",
          "name": "What blockchains does NYTHOS support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "NYTHOS currently monitors Ethereum (ETH), Bitcoin (BTC), and Base. Ethereum and Base provide full on-chain intelligence including DEX activity, bridge flows, and smart contract interactions. Bitcoin monitoring covers large-wallet accumulation and dormant-wallet reactivation signals."
          }
        },
        {
          "@type": "Question",
          "name": "How accurate are NYTHOS signals?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every NYTHOS signal is verified automatically after it fires. The public proof feed at nythos.io/proof shows verified hits and misses with full context. Accuracy is tracked over 24-hour windows and displayed live so you can judge performance yourself."
          }
        },
        {
          "@type": "Question",
          "name": "Is NYTHOS free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. NYTHOS is in open beta and fully free to use. Connect any EVM wallet (MetaMask, Coinbase Wallet, Rainbow, or any WalletConnect wallet) to access the full signal feed, wallet scoring, 30-day history, REST API, and Telegram alerts. Token-gated tiers are planned after the Base smart contract audit."
          }
        },
        {
          "@type": "Question",
          "name": "What is the $NYT token?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "$NYT is the NYTHOS access token planned for deployment on Base after a professional smart contract audit. It will gate Pro Access (100 $NYT) and Partner tiers (5,000 $NYT). The presale founder round is priced at $0.005 per token. The token is not required during open beta."
          }
        }
      ]
    }
